name: Playwright Tests CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - regression
          - ui
          - api

jobs:
  test:
    name: Run Playwright Tests
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Create reports directory
        run: mkdir -p reports/screenshots

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npm run type-check

      - name: Run tests (all)
        if: github.event.inputs.test_suite == 'all' || github.event.inputs.test_suite == ''
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          ENV: qa
          CI: true

      - name: Run smoke tests
        if: github.event.inputs.test_suite == 'smoke'
        run: npm run test:smoke
        env:
          ENV: qa
          CI: true

      - name: Run regression tests
        if: github.event.inputs.test_suite == 'regression'
        run: npm run test:regression
        env:
          ENV: qa
          CI: true

      - name: Run UI tests
        if: github.event.inputs.test_suite == 'ui'
        run: npm run test:ui
        env:
          ENV: qa
          CI: true

      - name: Run API tests
        if: github.event.inputs.test_suite == 'api'
        run: npm run test:api
        env:
          ENV: qa
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 30

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 30

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.shard }}
          path: reports/screenshots/
          retention-days: 30

  merge-reports:
    name: Merge Test Reports
    if: always()
    needs: test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: all-reports
          pattern: playwright-report-*

      - name: Merge reports
        run: |
          npx playwright merge-reports --reporter html all-reports
        continue-on-error: true

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-merged
          path: playwright-report/
          retention-days: 30

      - name: Deploy report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: reports/${{ github.run_number }}

  notify:
    name: Send Notifications
    if: always()
    needs: [test, merge-reports]
    runs-on: ubuntu-latest
    
    steps:
      - name: Notify on success
        if: needs.test.result == 'success'
        run: echo "All tests passed successfully!"

      - name: Notify on failure
        if: needs.test.result == 'failure'
        run: echo "Tests failed! Check the artifacts for details."
